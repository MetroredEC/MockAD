<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Incidencias Puntonet</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00b8e6;
    --cyan-dark: #0099c2;
    --navy: #003d5c;
    --navy-light: #004f75;
    --white: #ffffff;
    --gray-50: #f7f9fb;
    --gray-100: #eef2f6;
    --gray-300: #c8d4de;
    --gray-500: #6b8597;
    --gray-700: #3d5a6c;
    --success: #00a87e;
    --warn: #e09400;
    --error: #d92b42;
    --font: 'DM Sans', system-ui, sans-serif;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(0,61,92,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--gray-50); color: var(--navy); font-size: 14px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }

  header { background: var(--navy); color: var(--white); }
  .bar { max-width: 1240px; margin: 0 auto; padding: 18px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .bar img { height: 30px; }
  .bar h1 { font-size: 18px; font-weight: 600; flex: 1; min-width: 200px; }
  .bar h1 small { display: block; font-size: 12px; font-weight: 400; color: rgba(255,255,255,.65); }

  .btn { text-decoration: none; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: var(--gray-100); color: var(--navy); transition: background .15s; white-space: nowrap; }
  .btn:hover { background: var(--gray-300); }
  .btn.primary { background: var(--cyan); color: var(--navy); }
  .btn.primary:hover { background: var(--cyan-dark); color: var(--white); }
  .btn.ghost { background: transparent; border: 1.5px solid rgba(255,255,255,.3); color: var(--white); }
  .btn.ghost:hover { border-color: var(--cyan); }
  .btn.danger { background: transparent; color: var(--error); }
  .btn.danger:hover { background: #fde8eb; }

  main { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
  .notice { background: #fff6e0; border: 1px solid #f3d58a; color: #6b4b00; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 13px; }
  .notice.err { background: #fde8eb; border-color: #f2b2bc; color: #8a1426; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
  .kpi span { font-size: 12px; color: var(--gray-500); text-transform: uppercase; letter-spacing: .4px; font-weight: 600; }
  .kpi b { display: block; font-size: 28px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi em { font-style: normal; font-size: 12px; color: var(--gray-700); }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 10px; }
  .hbar { display: grid; grid-template-columns: 130px 1fr 28px; gap: 8px; align-items: center; font-size: 12.5px; margin: 5px 0; cursor: pointer; border-radius: 6px; }
  .hbar:hover .lbl { color: var(--cyan-dark); }
  .hbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .trk { height: 10px; background: var(--gray-100); border-radius: 5px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--cyan); border-radius: 5px; }
  .hbar .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .months { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
  .months div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--gray-500); gap: 4px; }
  .months i { display: block; width: 100%; max-width: 36px; background: var(--navy-light); border-radius: 4px 4px 0 0; min-height: 2px; }
  .months b { color: var(--navy); font-size: 12px; }

  .filters { display: grid; grid-template-columns: 2fr repeat(5, 1fr) auto auto; gap: 8px; margin-bottom: 12px; align-items: end; }
  .filters label, .form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--gray-700); }
  input, select, textarea { border: 1.5px solid var(--gray-300); border-radius: 9px; padding: 9px 10px; background: var(--white); width: 100%; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,184,230,.18); }
  textarea { resize: vertical; min-height: 90px; }
  .count { font-size: 13px; color: var(--gray-500); margin-bottom: 8px; }

  .tbl { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--gray-500); padding: 11px 12px; background: var(--gray-100); cursor: pointer; user-select: none; white-space: nowrap; }
  th[data-sort]::after { content: ' ↕'; opacity: .35; }
  th.asc::after { content: ' ↑'; opacity: 1; }
  th.desc::after { content: ' ↓'; opacity: 1; }
  td { padding: 11px 12px; border-top: 1px solid var(--gray-100); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f1fbfe; }
  td.desc { max-width: 460px; }
  td.desc p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  td.desc small { display: block; color: var(--gray-500); margin-top: 4px; font-size: 12px; }
  .nowrap { white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--gray-100); color: var(--gray-700); }
  .pill.Abierta { background: #fde8eb; color: #a01a2e; }
  .pill.En { background: #fff1d1; color: #7a5200; }
  .pill.Cerrada { background: #ddf6ee; color: #00694f; }
  .pill.SI { background: #ddf6ee; color: #00694f; }
  .pill.NO { background: #fde8eb; color: #a01a2e; }
  .empty { padding: 40px; text-align: center; color: var(--gray-500); }

  dialog { border: 0; border-radius: 18px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 32px); box-shadow: 0 24px 60px rgba(0,30,50,.3); color: var(--navy); }
  dialog::backdrop { background: rgba(0,30,50,.45); }
  .form { padding: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form h3 { grid-column: 1 / -1; font-size: 18px; }
  .form .full { grid-column: 1 / -1; }
  .form .actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .form .actions .btn.danger { margin-right: auto; }
  .form .meta { grid-column: 1 / -1; font-size: 12px; color: var(--gray-500); }
  .seg { display: flex; gap: 6px; }
  .seg input { display: none; }
  .seg span { flex: 1; text-align: center; border: 1.5px solid var(--gray-300); border-radius: 9px; padding: 8px 6px; cursor: pointer; font-weight: 500; color: var(--navy); }
  .seg input:checked + span { border-color: var(--cyan); background: #e3f8fd; font-weight: 600; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--navy); color: var(--white); padding: 11px 18px; border-radius: 10px; opacity: 0; transition: .25s; pointer-events: none; font-weight: 500; z-index: 10; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 980px) {
    .filters { grid-template-columns: 1fr 1fr 1fr; }
    .filters .q { grid-column: 1 / -1; }
  }
  @media (max-width: 720px) {
    .filters { grid-template-columns: 1fr 1fr; }
    .form { grid-template-columns: 1fr; }
    thead { display: none; }
    table, tbody, tr, td { display: block; }
    tr { padding: 12px 14px; border-top: 1px solid var(--gray-100); display: grid !important; grid-template-columns: 1fr auto; gap: 4px 10px; }
    td { padding: 0; border: 0; }
    td.desc { grid-column: 1 / -1; max-width: none; order: 3; }
    td.f { order: 1; font-weight: 600; }
    td.e { order: 2; }
    td.s, td.c, td.r, td.rp { order: 4; font-size: 12.5px; color: var(--gray-700); }
    td.rp, td.r { text-align: right; }
    .hbar { grid-template-columns: 100px 1fr 28px; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <img src="assets/metrored-logo-white.png" alt="Metrored">
    <h1>Control de incidencias Puntonet<small>Registro y seguimiento de incidencias con Metrored</small></h1>
    <a class="btn ghost" href="queja.html">Formulario de queja</a>
    <button class="btn ghost" id="btnCsv">Exportar CSV</button>
    <button class="btn primary" id="btnNueva">+ Nueva incidencia</button>
  </div>
</header>

<main>
  <div id="aviso"></div>

  <section class="kpis" id="kpis"></section>

  <section class="charts">
    <div class="card"><h2>Por mes</h2><div class="months" id="chMes"></div></div>
    <div class="card"><h2>Por categoría</h2><div id="chCat"></div></div>
    <div class="card"><h2>Por sucursal</h2><div id="chSuc"></div></div>
  </section>

  <section class="filters">
    <label class="q">Buscar<input type="search" id="fQ" placeholder="Texto, persona, sucursal…"></label>
    <label>Sucursal<select id="fSuc"></select></label>
    <label>Categoría<select id="fCat"></select></label>
    <label>Estado<select id="fEst"></select></label>
    <label>Desde<input type="date" id="fDesde"></label>
    <label>Hasta<input type="date" id="fHasta"></label>
    <label>Reportado<select id="fRep"><option value="">Todos</option><option>SI</option><option>NO</option><option value="-">Sin dato</option></select></label>
    <button class="btn" id="btnLimpiar">Limpiar</button>
  </section>

  <div class="count" id="count"></div>
  <div class="tbl">
    <table>
      <thead><tr>
        <th data-sort="fecha">Fecha</th>
        <th data-sort="descripcion">Descripción</th>
        <th data-sort="categoria">Categoría</th>
        <th data-sort="sucursal">Sucursal</th>
        <th data-sort="reporta">Reporta</th>
        <th data-sort="reportado">Reportado</th>
        <th data-sort="estado">Estado</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<dialog id="dlg">
  <form class="form" id="frm" method="dialog">
    <h3 id="dlgTitulo">Nueva incidencia</h3>
    <input type="hidden" name="id">
    <label>Fecha<input type="date" name="fecha" required></label>
    <label>Sucursal<input name="sucursal" list="lSuc" placeholder="Ej. QUITO" autocomplete="off"></label>
    <label class="full">Descripción<textarea name="descripcion" required placeholder="¿Qué pasó? Incluya horas, exámenes y solicitudes relacionadas."></textarea></label>
    <label>Categoría<select name="categoria"></select></label>
    <label>Reporta<input name="reporta" list="lRep" placeholder="Nombre de quien reporta" autocomplete="off"></label>
    <label>¿Reportado a Metrored?
      <div class="seg">
        <label><input type="radio" name="reportado" value="SI"><span>Sí</span></label>
        <label><input type="radio" name="reportado" value="NO"><span>No</span></label>
        <label><input type="radio" name="reportado" value=""><span>Sin dato</span></label>
      </div>
    </label>
    <label>Estado<select name="estado"></select></label>
    <label class="full">Seguimiento / respuesta de Metrored<textarea name="seguimiento" placeholder="Acciones tomadas, respuesta recibida, fecha de cierre…"></textarea></label>
    <div class="meta" id="dlgMeta"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="btnEliminar">Eliminar</button>
      <button type="button" class="btn" id="btnCancelar">Cancelar</button>
      <button type="submit" class="btn primary" id="btnGuardar">Guardar</button>
    </div>
  </form>
</dialog>
<datalist id="lSuc"></datalist>
<datalist id="lRep"></datalist>
<div class="toast" id="toast"></div>

<script src="assets/incidencias.js"></script>
<script>
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const $ = s => document.querySelector(s);

let datos = [];
let orden = { k: 'fecha', dir: -1 };

/* ───────── Carga ───────── */

async function cargar(op) {
  try {
    datos = (await (op || store.listar())).map(x => ({ ...x, sucursal: norm(x.sucursal), reporta: norm(x.reporta), reportado: norm(x.reportado) }));
    $('#aviso').innerHTML = ENDPOINT ? '' : '<div class="notice"><b>Modo demo:</b> las incidencias se guardan solo en este navegador. Para compartirlas con todo el equipo, configure el Apps Script (ver <code>apps-script/incidencias.gs</code>).</div>';
  } catch (e) {
    $('#aviso').innerHTML = `<div class="notice err">${e.message === 'clave' ? 'Clave incorrecta. Recargue la página e inténtelo de nuevo.' : 'No se pudo conectar con el registro de incidencias. Revise su conexión y recargue.'}</div>`;
  }
  render();
}

/* ───────── Filtros ───────── */

function opciones(sel, valores, todos) {
  const actual = sel.value;
  sel.innerHTML = (todos ? `<option value="">${todos}</option>` : '') + valores.map(v => `<option value="${esc(v || '-')}">${esc(v || 'Sin especificar')}</option>`).join('');
  if ([...sel.options].some(o => o.value === actual)) sel.value = actual;
}

function filtrar() {
  const q = norm($('#fQ').value), suc = $('#fSuc').value, cat = $('#fCat').value, est = $('#fEst').value,
        rep = $('#fRep').value, desde = $('#fDesde').value, hasta = $('#fHasta').value;
  return datos.filter(x =>
    (!q || norm([x.descripcion, x.sucursal, x.reporta, x.categoria, x.seguimiento].join(' ')).includes(q)) &&
    (!suc || (x.sucursal || '-') === suc) &&
    (!cat || x.categoria === cat) &&
    (!est || x.estado === est) &&
    (!rep || (rep === '-' ? !x.reportado : x.reportado === rep)) &&
    (!desde || x.fecha >= desde) &&
    (!hasta || x.fecha <= hasta)
  ).sort((a, b) => {
    const r = String(a[orden.k] || '').localeCompare(String(b[orden.k] || ''), 'es');
    return (r || String(a.creado).localeCompare(String(b.creado))) * orden.dir;
  });
}

/* ───────── Render ───────── */

function contar(lista, k) {
  const m = new Map();
  lista.forEach(x => m.set(x[k] || '', (m.get(x[k] || '') || 0) + 1));
  return [...m].sort((a, b) => b[1] - a[1]);
}

function barras(el, pares, filtro) {
  const max = Math.max(1, ...pares.map(p => p[1]));
  el.innerHTML = pares.length ? pares.map(([k, n]) =>
    `<div class="hbar" data-v="${esc(k || '-')}" title="Filtrar por ${esc(k || 'Sin especificar')}"><span class="lbl">${esc(k || 'Sin especificar')}</span><span class="trk"><span class="fill" style="width:${n / max * 100}%;display:block"></span></span><span class="n">${n}</span></div>`
  ).join('') : '<p class="empty">Sin datos</p>';
  el.querySelectorAll('.hbar').forEach(b => b.onclick = () => {
    const sel = $(filtro), i = [...sel.options].findIndex(o => o.value === b.dataset.v);
    sel.selectedIndex = sel.selectedIndex === i ? 0 : i;
    render();
  });
}

function render() {
  opciones($('#fSuc'), [...new Set(datos.map(x => x.sucursal))].sort(), 'Todas');
  opciones($('#fCat'), CATEGORIAS, 'Todas');
  opciones($('#fEst'), ESTADOS, 'Todos');
  $('#lSuc').innerHTML = [...new Set(datos.map(x => x.sucursal).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join('');
  $('#lRep').innerHTML = [...new Set(datos.flatMap(x => x.reporta.split('/').map(s => s.trim())).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join('');

  const lista = filtrar();

  // KPIs
  const abiertas = lista.filter(x => x.estado !== 'Cerrada').length;
  const rep = lista.filter(x => x.reportado === 'SI').length;
  const mes = hoy().slice(0, 7);
  const topSuc = contar(lista, 'sucursal')[0], topCat = contar(lista, 'categoria')[0];
  $('#kpis').innerHTML = [
    ['Incidencias', lista.length, lista.length === datos.length ? 'registradas' : `de ${datos.length} en total`],
    ['Sin cerrar', abiertas, `${lista.filter(x => x.estado === 'En gestión').length} en gestión`],
    ['Reportadas a Metrored', lista.length ? Math.round(rep / lista.length * 100) + '%' : '—', `${lista.filter(x => x.reportado === 'NO').length} sin reportar`],
    ['Este mes', datos.filter(x => (x.fecha || '').startsWith(mes)).length, MESES[+mes.slice(5) - 1] + ' ' + mes.slice(0, 4)],
    ['Categoría principal', topCat ? topCat[1] : '—', topCat ? esc(topCat[0]) : ''],
    ['Sucursal principal', topSuc ? topSuc[1] : '—', topSuc ? esc(topSuc[0] || 'Sin especificar') : '']
  ].map(([t, v, s]) => `<div class="kpi"><span>${t}</span><b>${v}</b><em>${s}</em></div>`).join('');

  // Por mes: del primer mes con datos al último
  const meses = lista.map(x => (x.fecha || '').slice(0, 7)).filter(Boolean).sort();
  const serie = [];
  if (meses.length) {
    let [y, m] = meses[0].split('-').map(Number);
    const fin = meses[meses.length - 1];
    for (let k = 0; k < 36; k++) {
      const key = `${y}-${String(m).padStart(2, '0')}`;
      serie.push([key, meses.filter(x => x === key).length]);
      if (key >= fin) break;
      if (++m > 12) { m = 1; y++; }
    }
  }
  const maxM = Math.max(1, ...serie.map(s => s[1]));
  $('#chMes').innerHTML = serie.length ? serie.map(([k, n]) =>
    `<div title="${n} incidencias"><b>${n}</b><i style="height:${n / maxM * 80}%"></i>${MESES[+k.slice(5) - 1]}</div>`).join('') : '<p class="empty">Sin datos</p>';

  barras($('#chCat'), contar(lista, 'categoria'), '#fCat');
  barras($('#chSuc'), contar(lista, 'sucursal'), '#fSuc');

  // Tabla
  document.querySelectorAll('th[data-sort]').forEach(th => th.className = th.dataset.sort === orden.k ? (orden.dir > 0 ? 'asc' : 'desc') : '');
  $('#count').textContent = `${lista.length} incidencia${lista.length === 1 ? '' : 's'}`;
  $('#rows').innerHTML = lista.length ? lista.map(x => `
    <tr data-id="${esc(x.id)}">
      <td class="f nowrap">${fmtFecha(x.fecha)}</td>
      <td class="desc"><p>${esc(x.descripcion)}</p>${x.seguimiento ? `<small>↳ ${esc(x.seguimiento)}</small>` : ''}</td>
      <td class="c">${esc(x.categoria)}</td>
      <td class="s">${esc(x.sucursal || '—')}</td>
      <td class="rp">${esc(x.reporta)}</td>
      <td class="r">${x.reportado ? `<span class="pill ${x.reportado}">${x.reportado === 'SI' ? 'Sí' : 'No'}</span>` : '<span class="pill">Sin dato</span>'}</td>
      <td class="e"><span class="pill ${esc((x.estado || '').split(' ')[0])}">${esc(x.estado)}</span></td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty">No hay incidencias con estos filtros.</td></tr>';
  document.querySelectorAll('#rows tr[data-id]').forEach(tr => tr.onclick = () => abrir(datos.find(x => x.id === tr.dataset.id)));
}

/* ───────── Formulario ───────── */

const frm = $('#frm'), dlg = $('#dlg');
let categoriaManual = false;

function abrir(inc) {
  const nueva = !inc;
  inc = inc || { id: '', fecha: hoy(), descripcion: '', sucursal: '', reporta: '', reportado: 'SI', categoria: 'Otros', estado: 'Abierta', seguimiento: '' };
  $('#dlgTitulo').textContent = nueva ? 'Nueva incidencia' : 'Editar incidencia';
  frm.categoria.innerHTML = CATEGORIAS.map(c => `<option>${c}</option>`).join('');
  frm.estado.innerHTML = ESTADOS.map(c => `<option>${c}</option>`).join('');
  ['id', 'fecha', 'descripcion', 'sucursal', 'reporta', 'categoria', 'estado', 'seguimiento'].forEach(k => frm[k].value = inc[k] || '');
  frm.querySelector(`input[name="reportado"][value="${inc.reportado || ''}"]`).checked = true;
  categoriaManual = !nueva;
  $('#btnEliminar').hidden = nueva;
  $('#dlgMeta').textContent = nueva ? '' : `Última actualización: ${new Date(inc.actualizado).toLocaleString('es-EC')}`;
  dlg.showModal();
  (nueva ? frm.descripcion : frm.estado).focus();
}

frm.descripcion.addEventListener('input', () => { if (!categoriaManual) frm.categoria.value = sugerirCategoria(frm.descripcion.value); });
frm.categoria.addEventListener('change', () => categoriaManual = true);
$('#btnCancelar').onclick = () => dlg.close();

frm.addEventListener('submit', async e => {
  e.preventDefault();
  const inc = Object.fromEntries(new FormData(frm));
  inc.id = inc.id || nuevoId();
  ['sucursal', 'reporta'].forEach(k => inc[k] = norm(inc[k]));
  inc.descripcion = inc.descripcion.trim();
  $('#btnGuardar').disabled = true;
  $('#btnGuardar').textContent = 'Guardando…';
  await cargar(store.guardar(inc));
  $('#btnGuardar').disabled = false;
  $('#btnGuardar').textContent = 'Guardar';
  dlg.close();
  toast('Incidencia guardada');
});

$('#btnEliminar').onclick = async () => {
  if (!confirm('¿Eliminar esta incidencia? No se puede deshacer.')) return;
  await cargar(store.eliminar(frm.id.value));
  dlg.close();
  toast('Incidencia eliminada');
};

/* ───────── Varios ───────── */

function toast(t) {
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}

$('#btnCsv').onclick = () => {
  const cols = ['fecha', 'descripcion', 'sucursal', 'reporta', 'reportado', 'categoria', 'estado', 'seguimiento'];
  const cel = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '﻿' + [cols.map(c => c.toUpperCase()).join(';')].concat(filtrar().map(x => cols.map(c => cel(c === 'fecha' ? fmtFecha(x[c]) : x[c])).join(';'))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `incidencias-puntonet-${hoy()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

$('#btnNueva').onclick = () => abrir();
$('#btnLimpiar').onclick = () => { document.querySelectorAll('.filters input, .filters select').forEach(el => el.tagName === 'SELECT' ? el.selectedIndex = 0 : el.value = ''); render(); };
document.querySelectorAll('.filters input, .filters select').forEach(el => el.addEventListener('input', render));
document.querySelectorAll('th[data-sort]').forEach(th => th.onclick = () => {
  orden = { k: th.dataset.sort, dir: orden.k === th.dataset.sort ? -orden.dir : (th.dataset.sort === 'fecha' ? -1 : 1) };
  render();
});

cargar();
</script>
